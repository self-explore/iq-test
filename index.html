<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2a3a">
<title>IQ 智力测评 · 五维认知画像</title>
<link rel="stylesheet" href="style.css?v=20261103">
</head>
<body>

<!-- ==================== 封面 ==================== -->
<section class="page active" id="page-cover">
  <div class="cover-deco"></div>
  <div class="cover-inner">
    <div class="cover-badge">IQ ASSESSMENT</div>
    <h1 class="cover-title">IQ 智力测评</h1>
    <p class="cover-sub">40 道题，测出你的智力结构与认知风格</p>

    <div class="cover-meta">
      <div class="cm-item"><div class="cm-num">40</div><div class="cm-label">道题目</div></div>
      <div class="cm-line"></div>
      <div class="cm-item"><div class="cm-num">5</div><div class="cm-label">维能力</div></div>
      <div class="cm-line"></div>
      <div class="cm-item"><div class="cm-num">8</div><div class="cm-label">分钟</div></div>
    </div>

    <div class="cover-tags">
      <span>逻辑推理</span><span>数学思维</span><span>语言理解</span><span>空间想象</span><span>细节洞察</span>
    </div>

    <button class="btn-main" id="btn-start">开始测评</button>

    <p class="cover-privacy">
      🔒 <strong>隐私声明</strong><br>
      本测试全程在您的浏览器本地运行，无需注册，不作答记录不会上传至任何服务器，也不会泄露。
    </p>
    <p class="cover-tip">建议在安静环境下独立完成，中途请勿查阅资料</p>
  </div>
</section>

<!-- ==================== 答题 ==================== -->
<section class="page" id="page-quiz">
  <div class="quiz-head">
    <div class="q-progress"><span id="q-num">Question 1</span><span id="q-total">40 total</span></div>
    <div class="q-track"><div class="q-bar" id="q-bar"></div></div>
  </div>
  <div class="quiz-body">
    <div class="q-tag" id="q-tag">逻辑推理</div>
    <h2 class="q-text" id="q-text"></h2>
    <div class="q-figure" id="q-figure"></div>
    <div class="q-opts" id="q-opts"></div>
  </div>
  <div class="quiz-foot"><button class="btn-ghost" id="btn-back">上一题</button></div>
</section>

<!-- ==================== 分析中 ==================== -->
<section class="page" id="page-loading">
  <div class="load-inner">
    <div class="load-ring"><div class="load-ring-in"></div></div>
    <div class="load-title">正在计算你的智力结构</div>
    <div class="load-pct" id="load-pct">0%</div>
    <div class="load-track"><div class="load-fill" id="load-fill"></div></div>
    <div class="load-step" id="load-step">正在核验作答…</div>
  </div>
</section>

<!-- ==================== 结果 ==================== -->
<section class="page" id="page-result">
  <div class="result-scroll" id="result-scroll"></div>
</section>

<script src="data-iq.js?v=20261103"></script>
<script src="app.js?v=20261103"></script>
</body>
</html>
